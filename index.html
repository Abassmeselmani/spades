<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://public-frontend-cos.metadl.com/mgx/img/favicon.png" type="image/png">
    <title>SPADES - Premium E-Commerce | Try Your Luck in Spades</title>
    <meta name="description" content="Premium shopping with a twist of luck. Try your luck in spades for exclusive discounts and rewards.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        /* Spades Loading Screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #000 0%, #220000 50%, #000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease-out;
        }

        .spades-loader {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .spade-card {
            position: absolute;
            width: 80px;
            height: 120px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 12px;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #000;
            animation: card-flip 2s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3);
        }

        .card-1 {
            top: 0;
            left: 20px;
            animation-delay: 0s;
        }

        .card-2 {
            top: 20px;
            left: 0;
            animation-delay: 0.5s;
        }

        .card-3 {
            top: 20px;
            right: 0;
            animation-delay: 1s;
        }

        @keyframes card-flip {
            0%, 100% {
                transform: rotateY(0deg) scale(1);
                background: linear-gradient(145deg, #ffffff, #f0f0f0);
            }
            50% {
                transform: rotateY(180deg) scale(1.1);
                background: linear-gradient(145deg, #dc2626, #991b1b);
                color: #fff;
            }
        }

        .loading-text {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(45deg, #dc2626, #ffffff, #dc2626);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 2s ease-in-out infinite;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Hide Loading screen after page loads */
        .loaded #loading-screen {
            opacity: 0;
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #dc2626, #000);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #000, #dc2626);
            background-clip: content-box;
        }

        /* Spade fade animation for cursor trail */
        @keyframes spade-fade {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(2) rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Spades Loading Screen -->
    <div id="loading-screen">
        <div class="spades-loader">
            <div class="spade-card card-1">♠</div>
            <div class="spade-card card-2">♠</div>
            <div class="spade-card card-3">♠</div>
            <div class="loading-text">Loading Your Luck</div>
        </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
        // Loading completion with card shuffle effect
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 1000);
            }, 2500);
        });

        // Spades cursor trail effect
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.9) { // Only create trail occasionally
                const spade = document.createElement('div');
                spade.innerHTML = '♠';
                spade.style.cssText = `
                    position: fixed;
                    left: ${e.clientX}px;
                    top: ${e.clientY}px;
                    font-size: 20px;
                    color: #dc2626;
                    pointer-events: none;
                    z-index: 9999;
                    animation: spade-fade 2s ease-out forwards;
                `;
                document.body.appendChild(spade);
                setTimeout(() => spade.remove(), 2000);
            }
        });
    </script>
</body>

</html>
